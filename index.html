<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GPS test pages (Leaflet)</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    #info {
      padding: 10px;
      font-size: 16px;
      background: #f0f0f0;
      font-family: sans-serif;
    }

    #map {
      height: calc(100vh - 50px);
      width: 100%;
    }
  </style>
</head>

<body>

<div id="info">Loading...</div>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const channelID = "3260394";
const readAPIKey = "KVGFCQ2EKLAWPI3H";

async function initMap() {

  const url =
    `https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&results=1`;

  const response = await fetch(url);
  const data = await response.json();

  const feed = data.feeds[0];

  const lat = parseFloat(feed.field1);
  const lng = parseFloat(feed.field2);

  // ThingSpeakの送信時刻（UTC）
  const timestamp = feed.created_at;

  // JSTへ変換
  const jstTime = new Date(timestamp).toLocaleString('ja-JP', {
    timeZone: 'Asia/Tokyo',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  });

  // 地図生成
  const map = L.map('map').setView([lat, lng], 17);

  // OpenStreetMapタイル
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // マーカー
  L.marker([lat, lng]).addTo(map)
    .bindPopup(`
      <b>Current Location</b><br>
      Latitude: ${lat}<br>
      Longitude: ${lng}<br>
      Updated: ${jstTime}
    `)
    .openPopup();

  // ページ上部に表示
  document.getElementById("info").innerHTML = `
    📍 GPS Location Updated Time:<br>
    ${jstTime}
  `;
}

initMap();

</script>

</body>
</html>
