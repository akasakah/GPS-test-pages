<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GPS test pages (Leaflet)</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const channelID = "3260394";
const readAPIKey = "KVGFCQ2EKLAWPI3H";

async function initMap() {

  const url =
    `https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&results=1`;

  const response = await fetch(url);
  const data = await response.json();

  const lat = parseFloat(data.feeds[0].field1);
  const lng = parseFloat(data.feeds[0].field2);

  // 地図生成
  const map = L.map('map').setView([lat, lng], 17);

  // OpenStreetMapタイル
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // マーカー
  L.marker([lat, lng]).addTo(map)
    .bindPopup("Current Location")
    .openPopup();
}

initMap();

</script>

</body>
</html>
