<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GPS Live Tracking (15s update)</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    #info {
      padding: 10px;
      font-size: 16px;
      background: #f0f0f0;
      font-family: sans-serif;
    }

    #map {
      height: calc(100vh - 50px);
      width: 100%;
    }
  </style>
</head>

<body>

<div id="info">Loading...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const channelID = "3260394";
const readAPIKey = "KVGFCQ2EKLAWPI3H";

let map;
let marker;
let lastTimestamp = "";

// 地図初期化（最初は仮位置）
map = L.map('map').setView([35.0, 139.0], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// データ取得・更新
async function updateData() {

  try {
    const url =
      `https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&results=1`;

    const response = await fetch(url);
    const data = await response.json();

    const feed = data.feeds[0];

    // 同じデータなら更新しない
    if (feed.created_at === lastTimestamp) {
      return;
    }
    lastTimestamp = feed.created_at;

    const lat = parseFloat(feed.field1);
    const lng = parseFloat(feed.field2);

    // JST変換
    const jstTime = new Date(feed.created_at).toLocaleString('ja-JP', {
      timeZone: 'Asia/Tokyo',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    });

    // マーカー更新
    if (marker) {
      map.removeLayer(marker);
    }

    marker = L.marker([lat, lng]).addTo(map)
      .bindPopup(`
        <b>Current Location</b><br>
        Latitude: ${lat}<br>
        Longitude: ${lng}<br>
        Updated: ${jstTime}
      `);

    // 自動追従
    map.setView([lat, lng], 17);

    // 表示更新
    document.getElementById("info").innerHTML = `
      📍 Latest GPS Data<br>
      Latitude: ${lat}<br>
      Longitude: ${lng}<br>
      Time: ${jstTime}
    `;

  } catch (err) {
    console.error("Update error:", err);
    document.getElementById("info").innerHTML =
      "⚠️ Data fetch error (ThingSpeak)";
  }
}

// 初回実行
updateData();

// 15秒ごと更新（ThingSpeak推奨）
setInterval(updateData, 15000);

</script>

</body>
</html>
